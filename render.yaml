# Render Blueprint（免費方案，$0／月）
# 用法：Render → New → Blueprint → 選 company-site repo → 填 GH_DATA_TOKEN。
# 免費方案 15 分鐘無流量會休眠（約 1 分鐘喚醒）。
services:
  - type: web
    name: company-site
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      # 資料存喺同一個 repo 的 data 分支（唔會觸發重新部署）
      - key: GH_DATA_REPO
        value: jonathankasde-wq/company-site
      - key: GH_DATA_BRANCH
        value: data
      # 在 Render 後台填（不要寫進 repo）
      - key: GH_DATA_TOKEN
        sync: false
